# @effect Jade リレー経由のプロンプトを、設定したセッションへの指示として取り込む。
# @values true / false。Jade リレーの設定が前提。
# jade_relay_reply_enabled = false

# @effect Jade 端末コマンドからローカルの画面付きセッションを開けるようにする。
# @values true / false。Jade リレーの設定が前提。
# jade_relay_launch_enabled = false

# @effect Ambient などのプッシュ通知の送信先となる ntfy トピックを指定する。
# @values トピック名の文字列。未指定なら ntfy 通知なし。
# @unset ntfy_topic

# @section クラウド引き継ぎ後の権限
# @source crates/jcode-base/src/config.rs#L619
# [cloud]

# @effect クラウドへ引き継いだセッションに、この端末の限定されたローカルリソースへのアクセスを許す期間。切断やセッション切り替えでも失効する。
# @values 0以上の整数（秒）。0で許可しない。86400秒は24時間。
# local_access_seconds = 86400

# @section WebSocket の待受
# @source crates/jcode-config-types/src/lib.rs#L1425
# [gateway]

# @effect iOS や Web クライアント向けの WebSocket ゲートウェイを有効にする。
# @values true / false。有効時は bind_addr と公開範囲を確認。
# enabled = false

# @effect WebSocket ゲートウェイの待受ポートを選ぶ。
# @values 通常1〜65535の未使用ポートを整数で指定。
# port = 7643

# @effect WebSocket ゲートウェイの待受アドレスを選ぶ。ポートの公開範囲に影響する。
# @values IPアドレスの文字列。"127.0.0.1" はローカルのみ、"0.0.0.0" は全IPv4インターフェース。
# bind_addr = "0.0.0.0"
