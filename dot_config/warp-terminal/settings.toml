[code]

[code.editor]
show_code_review_button = true
show_project_explorer = true
show_global_search = true
auto_open_code_review_pane_on_first_agent_change = false
auto_save = true

[agents]
cloud_conversation_storage_enabled = true

[agents.third_party]
should_render_cli_agent_toolbar = false

[agents.warp_agent]
is_any_ai_enabled = true

[agents.warp_agent.other]
show_agent_notifications = true
show_conversation_history = true

[general]
default_session_mode = "agent"

[warp_drive]
enabled = true

[text_editing]
vim_mode_enabled = false

[appearance]
spacing = "normal"

[appearance.vertical_tabs]
enabled = true
use_latest_prompt_as_title = true

[appearance.text]
notebook_font_size = 14.0
font_size = 13.0
font_name = "PlemolJP35 Console NF"
ai_font_name = "PlemolJP35 Console NF"
match_ai_font = true
ligature_rendering_enabled = true

[appearance.themes]
theme = "gruvbox_dark"

[appearance.panes]
should_dim_inactive_panes = true
focus_pane_on_hover = true

[appearance.tabs]
workspace_decoration_visibility = "always_show"
tab_close_button_position = "right"
preserve_active_tab_color = true

[privacy]
crash_reporting_enabled = false
telemetry_enabled = false

[terminal]
osc52_clipboard_access = "read_write"

[terminal.input]
input_box_type_setting = "universal"
honor_ps1 = false
completions_open_while_typing = true
alias_expansion_enabled = true

[terminal.input.extra_meta_keys]
left_alt = true
right_alt = true

[warpify]

[warpify.ssh]
enable_ssh_warpification = true

[notifications]
toast_duration_secs = 8

[notifications.preferences]
is_agent_task_completed_enabled = true
is_long_running_enabled = true
is_needs_attention_enabled = true
is_password_prompt_enabled = true
long_running_threshold = 30
mode = "enabled"
play_notification_sound = true

[global_hotkey]

[global_hotkey.dedicated_window]
enabled = true

[global_hotkey.dedicated_window.settings]
active_pin_position = "bottom"
hide_window_when_unfocused = false
keybinding = "alt-space"

[global_hotkey.dedicated_window.settings.pin_position_to_size_percentages]
bottom = { height = 30, width = 100 }
left = { height = 100, width = 40 }
right = { height = 100, width = 40 }
top = { height = 30, width = 100 }

[global_hotkey.toggle_all_windows]
enabled = false
